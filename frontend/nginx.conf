# ============================================================================
# nginx configuration for the ElderLife AI frontend container.
#
# Two jobs:
#   1. Serve the built single-page app, sending unknown paths to index.html so
#      client-side routes such as /residents/3 survive a page refresh.
#   2. Optionally proxy /api/ to the backend, which avoids any cross-origin
#      request. See the note below.
#
# IMPORTANT — nginx `add_header` inheritance
# ------------------------------------------
# nginx replaces, rather than merges, `add_header` directives from an enclosing
# block once a nested block declares its own. Because `/`, `/assets/` and
# `/index.html` each set `Cache-Control`, security headers written at server
# level were dropped from exactly the responses that needed them. The headers
# therefore live in `security-headers.conf` and are `include`d by every
# location block. Do not move them back up to server level.
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compression --------------------------------------------------------
    # The JavaScript bundle is ~313 kB uncompressed; gzip roughly thirds it.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Hashed, immutable assets ------------------------------------------
    # Vite puts a content hash in each asset filename, so a changed file gets a
    # new name. These can therefore be cached indefinitely.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        # A single explicit Cache-Control, rather than `expires 1y` plus an
        # `add_header`. The two together emitted *two* Cache-Control headers on
        # every asset (verified on nginx 1.27.5), and a duplicate header is
        # ambiguous to some proxies and caches.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Proxy to the backend (optional) ------------------------------------
    # Enabled by setting VITE_API_BASE_URL=/api at build time, which makes the
    # browser call the same origin and removes the need for CORS entirely.
    #
    # The default build uses http://localhost:8000 directly instead, so this
    # block is inert unless the variable is changed. `backend` is the Compose
    # service name; it resolves on the Compose network.
    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- The app itself -----------------------------------------------------
    # `try_files` falls back to index.html, which is what makes a deep link such
    # as /residents/3 work when the user reloads the page: the file does not
    # exist on disk, so React Router handles the path in the browser.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Do not cache index.html, or a deploy would keep serving the old bundle
    # reference and users would see a stale app.
    #
    # This uses `try_files` rather than only matching the literal
    # `/index.html` path, so the no-cache rule applies both to a direct request
    # for the file and to the SPA fallback that serves it for deep links.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
