# ============================================================================
# Security headers, applied to every response.
#
# Why this is a separate file
# ---------------------------
# nginx does NOT merge `add_header` across levels. If a `location` block
# declares even one `add_header`, every `add_header` from the enclosing
# `server` block is discarded for that location. The headers were originally
# written at server level, but `/`, `/assets/` and `/index.html` each declare
# their own `add_header Cache-Control`, so the security headers were silently
# dropped on the responses that matter most.
#
# The verified symptom (nginx 1.27.5, before this fix):
#   GET /                -> no X-Content-Type-Options, no X-Frame-Options
#   GET /assets/x.js     -> no security headers, two Cache-Control headers
#   GET /deep/route      -> no security headers
#
# Including this file from every location block restores them.
#
# `always` means the header is sent on error responses too, not only 2xx/3xx.
# ============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The app is a single-page bundle with no inline scripts and no third-party
# origins. Keeping the policy strict costs nothing here and blocks a whole
# class of injection. `connect-src` allows the API origin the bundle was built
# against (VITE_API_BASE_URL); see frontend/Dockerfile.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
