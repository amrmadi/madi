[pytest]
# Pytest configuration for the ElderLife AI backend test suite.
#
# Run from the repository root:
#     .venv\Scripts\python.exe -m pytest -v
#
# Run only the access-control tests:
#     .venv\Scripts\python.exe -m pytest backend\tests -v -k access
#
# Run only the AI interface tests:
#     .venv\Scripts\python.exe -m pytest ai\tests -v
#
# Both suites run against in-memory SQLite (or with no database at all for
# `ai/tests`), so neither needs PostgreSQL, Docker, or a network.

testpaths = backend/tests ai/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show a line per test and a short summary of failures.
addopts = -ra --strict-markers --tb=short

# asyncio_mode is set so async tests (if added later) behave predictably.
asyncio_mode = auto

markers =
    slow: tests that take noticeably longer
