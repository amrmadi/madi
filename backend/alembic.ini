# ============================================================
# Alembic configuration for ElderLife AI
# ============================================================
# Alembic is the tool that creates and updates database tables from the
# SQLAlchemy models in `backend/app/models/`.
#
# IMPORTANT: this file deliberately does NOT contain the database URL.
# The real URL is read in `alembic/env.py` from the app settings
# (i.e. from your `.env` file or environment variables). That keeps
# credentials out of version control.
# ============================================================

[alembic]
# Location of the migration scripts.
script_location = alembic

# Files added to a new revision are prefixed with the revision id.
file_template = %%(rev)s_%%(slug)s

# Put timestamps on revisions so history is readable in order.
timezone = UTC

# `prepend_sys_path` makes the project root importable, so `env.py` can do
# `from backend.app.models import ...`.
prepend_sys_path = ..

# Version-table name. Default is fine.
version_table = alembic_version

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
